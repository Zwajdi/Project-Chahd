<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Bienvenue sur la plateforme étudiante de l'ISET Djerba."
    />
    <title>Bienvenue à l'ISET Djerba</title>
    <link rel="stylesheet" href="css/style.css" />
    <style>
      :root {
        --landing-ink: #102b43;
        --landing-blue: #0b4f6c;
        --landing-teal: #168f87;
        --landing-line: rgba(11, 79, 108, 0.14);
      }

      .landing-page {
        min-height: 100vh;
        overflow: hidden;
        overflow-x: hidden;
        color: var(--landing-ink);
        background:
          radial-gradient(circle at 14% 18%, rgba(125, 213, 228, 0.3), transparent 31%),
          radial-gradient(circle at 88% 80%, rgba(91, 174, 174, 0.18), transparent 30%),
          linear-gradient(135deg, #fafdff 0%, #eef7fb 52%, #eaf5f5 100%);
        position: relative;
      }

      .landing-page::before,
      .landing-page::after {
        content: "";
        position: absolute;
        z-index: 0;
        pointer-events: none;
        border: 1px solid rgba(11, 79, 108, 0.08);
        border-radius: 50%;
      }

      .landing-page::before {
        width: 46rem;
        height: 46rem;
        top: -24rem;
        right: -11rem;
        animation: landing-drift 18s ease-in-out infinite alternate;
      }

      .landing-page::after {
        width: 30rem;
        height: 30rem;
        bottom: -19rem;
        left: -10rem;
        animation: landing-drift 22s ease-in-out infinite alternate-reverse;
      }

      .landing-header {
        position: relative;
        z-index: 1;
        display: flex;
        align-items: center;
        justify-content: space-between;
        width: min(100% - 3rem, 1240px);
        margin: 0 auto;
        padding: 1.8rem 0;
        opacity: 0;
        animation: landing-rise 0.7s ease 0.1s forwards;
      }

      .landing-brand {
        display: inline-flex;
        align-items: center;
        gap: 0.75rem;
      }

      .landing-brand-mark {
        display: grid;
        place-items: center;
        width: 2.9rem;
        height: 2.9rem;
        border-radius: 12px;
        color: #fff;
        font-weight: 800;
        font-size: 1.3rem;
        background: linear-gradient(145deg, var(--landing-blue), var(--landing-teal));
        box-shadow: 0 10px 24px rgba(11, 79, 108, 0.2);
      }

      .landing-brand-text {
        display: grid;
        gap: 0.1rem;
        line-height: 1.2;
      }

      .landing-brand-text strong {
        font-size: 1rem;
        letter-spacing: 0.01em;
      }

      .landing-brand-text small {
        color: #5e7486;
        font-size: 0.73rem;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .landing-header-link {
        color: var(--landing-blue);
        font-size: 0.86rem;
        font-weight: 700;
      }

      .landing-main {
        position: relative;
        z-index: 1;
        display: grid;
        place-items: center;
        min-height: calc(100vh - 6.8rem);
        padding: 3rem 1.5rem 6rem;
        text-align: center;
      }

      .landing-content {
        width: min(100%, 850px);
      }

      .landing-eyebrow {
        display: inline-flex;
        align-items: center;
        gap: 0.6rem;
        color: var(--landing-teal);
        font-size: 0.76rem;
        font-weight: 800;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        opacity: 0;
        animation: landing-rise 0.75s ease 0.28s forwards;
      }

      .landing-eyebrow::before,
      .landing-eyebrow::after {
        content: "";
        width: 2.4rem;
        height: 1px;
        background: var(--landing-line);
      }

      .landing-title {
        max-width: 850px;
        margin: 1.35rem auto 1.4rem;
        color: var(--landing-ink);
        font-size: clamp(3.1rem, 8vw, 6.8rem);
        font-weight: 750;
        letter-spacing: -0.065em;
        line-height: 0.98;
        opacity: 0;
        animation: landing-title 1s cubic-bezier(0.2, 0.75, 0.25, 1) 0.38s forwards;
      }

      .landing-title em {
        display: block;
        color: var(--landing-blue);
        font-style: normal;
      }

      .landing-subtitle {
        max-width: 560px;
        margin: 0 auto;
        color: #526b7b;
        font-size: clamp(1rem, 2vw, 1.25rem);
        line-height: 1.7;
        opacity: 0;
        animation: landing-rise 0.8s ease 0.82s forwards;
      }

      .landing-action {
        display: inline-flex;
        align-items: center;
        gap: 0.8rem;
        margin-top: 2.4rem;
        padding: 1rem 1.5rem 1rem 1.25rem;
        border: 1px solid rgba(255, 255, 255, 0.28);
        border-radius: 14px;
        color: #fff;
        background: linear-gradient(135deg, var(--landing-blue), var(--landing-teal));
        box-shadow: 0 14px 28px rgba(11, 79, 108, 0.2);
        font-size: 1rem;
        font-weight: 800;
        transition: transform 0.25s ease, box-shadow 0.25s ease, filter 0.25s ease;
        opacity: 0;
        animation: landing-rise 0.8s ease 1.18s forwards;
      }

      .landing-action:hover,
      .landing-action:focus-visible {
        transform: translateY(-4px);
        filter: saturate(1.08);
        box-shadow: 0 20px 34px rgba(11, 79, 108, 0.28);
      }

      .landing-action:focus-visible {
        outline: 3px solid rgba(22, 143, 135, 0.32);
        outline-offset: 4px;
      }

      .landing-action-icon {
        display: grid;
        place-items: center;
        width: 2rem;
        height: 2rem;
        border-radius: 9px;
        background: rgba(255, 255, 255, 0.16);
        font-size: 1.05rem;
      }

      .landing-action-arrow {
        font-size: 1.25rem;
        transition: transform 0.25s ease;
      }

      .landing-action:hover .landing-action-arrow,
      .landing-action:focus-visible .landing-action-arrow {
        transform: translateX(4px);
      }

      .landing-footer-note {
        position: absolute;
        right: 1.5rem;
        bottom: 1.8rem;
        left: 1.5rem;
        color: #78909f;
        font-size: 0.76rem;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        opacity: 0;
        animation: landing-rise 0.7s ease 1.45s forwards;
      }

      @keyframes landing-rise {
        from {
          opacity: 0;
          transform: translateY(16px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @keyframes landing-title {
        from {
          opacity: 0;
          transform: translateY(24px) scale(0.98);
          filter: blur(5px);
        }
        to {
          opacity: 1;
          transform: translateY(0) scale(1);
          filter: blur(0);
        }
      }

      @keyframes landing-drift {
        from {
          transform: translate3d(0, 0, 0) rotate(0deg);
        }
        to {
          transform: translate3d(18px, 12px, 0) rotate(8deg);
        }
      }

      @media (max-width: 600px) {
        .landing-page::before,
        .landing-page::after {
          display: none;
        }

        .landing-header {
          width: min(100% - 2rem, 1240px);
          padding-top: 1.2rem;
        }

        .landing-header-link {
          font-size: 0.78rem;
        }

        .landing-main {
          min-height: calc(100vh - 5.4rem);
          padding: 2rem 1.2rem 5rem;
        }

        .landing-title {
          margin-top: 1.15rem;
          font-size: clamp(3rem, 16vw, 4.5rem);
        }

        .landing-title em {
          margin-top: 0.15rem;
        }

        .landing-eyebrow::before,
        .landing-eyebrow::after {
          width: 1.25rem;
        }

        .landing-footer-note {
          bottom: 1.25rem;
          font-size: 0.65rem;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .landing-page *,
        .landing-page::before,
        .landing-page::after {
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.01ms !important;
        }
      }
    </style>
  </head>
  <body data-page="home" class="landing-page">
    <a class="skip-link" href="#main-content">Aller au contenu</a>

    <header class="landing-header">
      <a class="landing-brand" href="index.html" aria-label="Accueil ISET Djerba">
        <span class="landing-brand-mark">I</span>
        <span class="landing-brand-text">
          <strong>ISET Djerba</strong>
          <small>Plateforme étudiante</small>
        </span>
      </a>
      
    </header>

    <main id="main-content" class="landing-main">
      <div class="landing-content">
        <span class="landing-eyebrow">Plateforme étudiante</span>
        <h1 class="landing-title">
          Bienvenue à <em>l'ISET Djerba</em>
        </h1>
        <p class="landing-subtitle">
          Votre espace pour accompagner et suivre chaque étape de votre stage.
        </p>
        <a class="landing-action" href="espace-etudiant.html">
          <span class="landing-action-icon" aria-hidden="true">🎓</span>
          <span>Espace Étudiant</span>
          <span class="landing-action-arrow" aria-hidden="true">→</span>
        </a>
      </div>
      <p class="landing-footer-note">Institut supérieur des études technologiques de Djerba</p>
    </main>
  </body>
</html>
