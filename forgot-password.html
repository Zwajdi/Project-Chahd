<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Réinitialiser le mot de passe | ISET Djerba</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <main class="auth-page">
      <div class="container auth-shell">
        <section class="auth-card">
          <a href="login.html" class="brand" aria-label="Retour à la connexion">
            <span class="brand-mark">I</span>
            <span class="brand-text"
              ><strong>ISET Djerba</strong
              ><small>Stage ISET Djerba</small></span
            >
          </a>
          <span class="eyebrow">Accès au compte</span>
          <h1>Mot de passe oublié ?</h1>
          <p>Retrouvez votre compte avec votre CIN ou votre email.</p>
          <form id="forgot-form" class="auth-form" novalidate>
            <div class="field">
              <label for="identifier">CIN ou Email</label
              ><input id="identifier" name="identifier" type="text" required />
            </div>
            <button class="btn btn-secondary" type="submit">
              Rechercher mon compte
            </button>
            <div id="reset-fields" class="hidden">
              <div class="field">
                <label for="new-password">Nouveau mot de passe</label
                ><input id="new-password" type="password" />
              </div>
              <div class="field">
                <label for="new-password-confirm"
                  >Confirmer le nouveau mot de passe</label
                ><input id="new-password-confirm" type="password" />
              </div>
              <button
                id="reset-password-button"
                class="btn btn-primary"
                type="button"
              >
                Confirmer
              </button>
            </div>
            <p id="forgot-message" class="form-message" role="alert"></p>
          </form>
          <p class="auth-note">
            Cette réinitialisation est une simulation frontend : aucun email
            réel n'est envoyé.
          </p>
          <div class="auth-links">
            <a href="login.html">Retour à la connexion</a>
          </div>
        </section>
      </div>
    </main>
    <script src="js/script.js"></script>
  </body>
</html>
